[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "valiron"
version = "0.2.0"
description = "AI regulatory compliance validation for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abhay Sachan" }]
requires-python = ">=3.9"
keywords = [
    "CDSCO", "FDA", "EU AI Act", "RBI",
    "clinical AI", "medical AI",
    "AI compliance", "AI validation",
    "regulatory", "healthcare AI",
    "bias detection", "model validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "jinja2>=3.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.12"]
torch = ["torch>=1.10"]
pdf = ["weasyprint>=57"]
all = ["onnxruntime>=1.12", "torch>=1.10", "weasyprint>=57"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/abhaysachan007/valiron"
Issues = "https://github.com/abhaysachan007/valiron/issues"

[tool.hatch.build.targets.wheel]
packages = ["valiron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=valiron --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
