<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace" font-size="13">
  <rect width="680" height="340" rx="10" fill="#1e1e2e"/>
  <rect width="680" height="32" rx="10" fill="#313244"/>
  <rect y="22" width="680" height="10" fill="#313244"/>
  <circle cx="20" cy="16" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="16" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="16" r="6" fill="#a6e3a1"/>
  <text x="340" y="21" text-anchor="middle" fill="#cdd6f4" font-size="12">valiron demo</text>

  <g fill="#cdd6f4">
    <text x="20" y="65"><tspan fill="#a6e3a1">$ </tspan>pip install valiron</text>
    <text x="20" y="85" fill="#6c7086" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.8s" fill="freeze"/>
      Successfully installed valiron-0.2.0
    </text>

    <text x="20" y="115" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.4s" fill="freeze"/>
      <tspan fill="#a6e3a1">$ </tspan>python -c "import valiron; result = valiron.evaluate(model, X_test, y_test, regulation='cdsco_mdsw')"
    </text>

    <text x="20" y="145" fill="#6c7086" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.0s" fill="freeze"/>
      Running CDSCO MDSW checks...
    </text>
    <text x="20" y="163" fill="#6c7086" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.4s" fill="freeze"/>
      Bootstrap CIs (500 resamples)...
    </text>

    <text x="20" y="193" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.0s" fill="freeze"/>
      Accuracy:    <tspan fill="#a6e3a1">0.880</tspan>  [0.810-0.940]
    </text>
    <text x="20" y="211" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.2s" fill="freeze"/>
      Sensitivity: <tspan fill="#a6e3a1">0.900</tspan>  [0.830-0.955]
    </text>
    <text x="20" y="229" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.4s" fill="freeze"/>
      AUC-ROC:     <tspan fill="#a6e3a1">0.875</tspan>  [0.800-0.940]
    </text>

    <text x="20" y="261" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.8s" fill="freeze"/>
      <tspan fill="#a6e3a1">COMPLIANT</tspan> -- CDSCO MDSW  |  score=1.000
    </text>
    <text x="20" y="279" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.0s" fill="freeze"/>
      Report: cdsco_report.html (<tspan fill="#a6e3a1">8.1 KB</tspan>)
    </text>
    <text x="20" y="297" fill="#6c7086" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.2s" fill="freeze"/>
      Done in 4.2s
    </text>
  </g>

  <rect x="20" y="315" width="8" height="13" fill="#cdd6f4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
